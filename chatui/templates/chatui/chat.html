<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemoryBot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0e14;
      --surface: #13141c;
      --surface2: #1c1e2a;
      --border: #2a2d3e;
      --accent: #6c63ff;
      --accent2: #ff6b9d;
      --text: #e2e4f0;
      --muted: #6b7280;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 1.1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right { display: flex; align-items: center; gap: 1rem; }

    .badge {
      font-size: 0.7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    #status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 5px;
    }
    #status-dot.offline { background: #ef4444; }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .clear-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg-row {
      display: flex;
      gap: 0.6rem;
      animation: fadeUp 0.25s ease;
    }
    .msg-row.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 600;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', monospace;
    }
    .avatar.bot  { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .avatar.user { background: var(--surface2); border: 1px solid var(--border); }

    .bubble {
      max-width: 65%;
      padding: 0.8rem 1.1rem;
      font-size: 0.9rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.bot  {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px 14px 14px 14px;
    }
    .bubble.user {
      background: var(--accent);
      border-radius: 14px 4px 14px 14px;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 0.9rem 1.1rem;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    .turn-counter {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      padding: 0.3rem;
      flex-shrink: 0;
    }

    #input-area {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      height: 44px;
      padding: 0 1.4rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    #send-btn:hover    { opacity: 0.88; }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ MemoryBot</div>
    <div class="header-right">
      <div class="badge">
        <span id="status-dot"></span>summary_buffer
      </div>
      <a href="/clear/" class="clear-btn">Clear Session</a>
    </div>
  </header>

  <div id="chat-box">
    <div class="msg-row bot">
      <div class="avatar bot">AI</div>
      <div class="bubble bot">Hello! I'm your AI assistant with memory. I'll remember everything we discuss. How can I help you?</div>
    </div>
  </div>

  <div class="turn-counter">Turn: <span id="turn-count">0</span></div>

  <div id="input-area">
    <textarea id="msg-input" placeholder="Type a message… (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const SESSION_ID = "{{ session_id }}";
    const chatBox   = document.getElementById("chat-box");
    const input     = document.getElementById("msg-input");
    const sendBtn   = document.getElementById("send-btn");
    const turnCount = document.getElementById("turn-count");
    const statusDot = document.getElementById("status-dot");

    let ws;

    function connect() {
      ws = new WebSocket(`ws://${window.location.host}/ws/chat/${SESSION_ID}/`);

      ws.onopen = () => {
        statusDot.classList.remove("offline");
      };

      ws.onclose = () => {
        statusDot.classList.add("offline");
        setTimeout(connect, 3000);  // auto-reconnect
      };

      ws.onmessage = (e) => {
        removeTyping();
        const data = JSON.parse(e.data);
        addMessage(data.reply, "bot");
        turnCount.textContent = data.turn_count;
        sendBtn.disabled = false;
        input.focus();
      };

      ws.onerror = () => {
        statusDot.classList.add("offline");
      };
    }

    function addMessage(text, role) {
      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      const avatar = document.createElement("div");
      avatar.className = `avatar ${role}`;
      avatar.textContent = role === "user" ? "You" : "AI";

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;

      if (role === "user") {
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement("div");
      row.id = "typing-row";
      row.className = "msg-row bot";
      row.innerHTML = `
        <div class="avatar bot">AI</div>
        <div class="bubble bot typing-indicator">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>`;
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing-row");
      if (t) t.remove();
    }

    function sendMessage() {
      const msg = input.value.trim();
      if (!msg || !ws || ws.readyState !== WebSocket.OPEN) return;

      addMessage(msg, "user");
      showTyping();
      ws.send(JSON.stringify({ message: msg }));

      input.value = "";
      input.style.height = "44px";
      sendBtn.disabled = true;
    }

    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener("input", function () {
      this.style.height = "44px";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    connect();
  </script>

</body>
</html>
